[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0"
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # Import sorting
    "UP", # pyupgrade
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.venv",
]
typeCheckingMode = "standard"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
